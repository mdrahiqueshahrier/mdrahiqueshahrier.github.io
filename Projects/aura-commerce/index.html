<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aura Luxe &mdash; Next-Gen E-Commerce Experience | Rahique.dev Live Demo</title>
  <meta name="theme-color" content="#06070a" />

  <!-- Matching Neon RS Monogram Browser Tab Favicon -->
  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64' fill='none'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2300E5FF'/%3E%3Cstop offset='50%25' stop-color='%2338BDF8'/%3E%3Cstop offset='100%25' stop-color='%23A855F7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='4' y='4' width='56' height='56' rx='14' fill='%23070B14' stroke='url(%23g)' stroke-width='3'/%3E%3Cpath d='M16 45V19H25.5C29.2 19 31.5 21.2 31.5 25C31.5 28.8 29.2 31 25.5 31H16M24.5 31L31 45' stroke='url(%23g)' stroke-width='3.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M48 22.5C46.5 19.8 43.2 19 40 19.6C36.8 20.2 35.4 23.2 36.4 26C37.2 28.3 39.6 29.5 42.6 30.8C45.8 32.2 48.2 33.8 48.2 37.8C48.2 42 44.8 45 40.5 45C37.2 45 34.8 43.4 33.8 40.8' stroke='%2300E5FF' stroke-width='3.8' stroke-linecap='round'/%3E%3C/svg%3E"
  />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        },
      },
    };
  </script>
  <style>
    body {
      background-color: #06070a;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
    }
    .aura-card {
      background: rgba(14, 17, 26, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.14);
      backdrop-filter: blur(14px);
    }
  </style>
</head>
<body class="antialiased selection:bg-cyan-400/30">
  <!-- Navbar -->
  <header class="sticky top-0 z-40 border-b border-slate-800/80 bg-[#06070a]/85 backdrop-blur-xl">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6 lg:px-8">
      <a href="#top" class="flex items-center gap-2.5 font-display text-xl font-bold tracking-wider text-white">
        <span class="h-3 w-3 rounded-full bg-gradient-to-tr from-cyan-400 to-sky-200"></span>
        <span>AURA <span class="font-light text-cyan-300">LUXE</span></span>
      </a>

      <button
        id="open-cart-btn"
        type="button"
        class="inline-flex items-center gap-2.5 rounded-full border border-cyan-400/40 bg-cyan-400/10 px-5 py-2 text-sm font-semibold text-white transition-colors hover:bg-cyan-400/20"
      >
        <i class="fa-solid fa-bag-shopping text-cyan-300" aria-hidden="true"></i>
        <span>Bag</span>
        <span id="cart-count" class="rounded-full bg-cyan-400 px-2 py-0.5 font-mono text-xs font-bold text-slate-950">0</span>
      </button>
    </div>
  </header>

  <main id="top" class="relative overflow-hidden pb-28">
    <div class="pointer-events-none absolute -top-24 left-1/2 h-96 w-[40rem] -translate-x-1/2 rounded-full bg-cyan-500/15 blur-[130px]" aria-hidden="true"></div>

    <!-- Hero -->
    <section class="relative z-10 mx-auto max-w-7xl px-4 pb-10 pt-16 text-center sm:px-6 lg:px-8">
      <p class="font-mono text-xs uppercase tracking-[0.28em] text-cyan-300">Obsidian Edition // 2026 Collection</p>
      <h1 class="mt-4 font-display text-4xl font-bold tracking-tight text-white sm:text-6xl">
        Precision Acoustic &amp; Wearable Hardware
      </h1>
      <p class="mx-auto mt-4 max-w-2xl text-base text-slate-400">
        Filter the collection, inspect technical specifications with Quick View, and test the live slide-out shopping bag.
      </p>

      <!-- Interactive Category Filters -->
      <div class="mt-8 flex flex-wrap justify-center gap-3">
        <button type="button" data-cat="all" class="cat-btn rounded-full bg-white px-5 py-2 text-xs font-bold uppercase tracking-wider text-slate-950">All</button>
        <button type="button" data-cat="audio" class="cat-btn rounded-full border border-slate-700 bg-slate-900/70 px-5 py-2 text-xs font-semibold uppercase tracking-wider text-slate-300 hover:border-cyan-400">Audio</button>
        <button type="button" data-cat="wearables" class="cat-btn rounded-full border border-slate-700 bg-slate-900/70 px-5 py-2 text-xs font-semibold uppercase tracking-wider text-slate-300 hover:border-cyan-400">Wearables</button>
        <button type="button" data-cat="accessories" class="cat-btn rounded-full border border-slate-700 bg-slate-900/70 px-5 py-2 text-xs font-semibold uppercase tracking-wider text-slate-300 hover:border-cyan-400">Accessories</button>
      </div>
    </section>

    <!-- Product Grid -->
    <section class="relative z-10 mx-auto max-w-7xl px-4 pt-6 sm:px-6 lg:px-8">
      <div id="product-grid" class="grid gap-7 sm:grid-cols-2 lg:grid-cols-3"></div>
    </section>
  </main>

  <!-- Quick-View Modal -->
  <div id="quickview-modal" role="dialog" aria-modal="true" aria-labelledby="qv-title" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 p-4 backdrop-blur-md">
    <div class="aura-card w-full max-w-lg rounded-3xl p-6 sm:p-8">
      <div class="flex items-start justify-between">
        <div>
          <span id="qv-cat" class="font-mono text-xs uppercase tracking-widest text-cyan-300">Category</span>
          <h2 id="qv-title" class="mt-1 font-display text-2xl font-bold text-white">Product Title</h2>
        </div>
        <button id="qv-close" type="button" class="text-slate-400 hover:text-white" aria-label="Close quick view">
          <i class="fa-solid fa-xmark text-lg" aria-hidden="true"></i>
        </button>
      </div>
      <p id="qv-desc" class="mt-4 text-sm leading-relaxed text-slate-300"></p>
      <div class="mt-6 flex items-center justify-between border-t border-slate-800 pt-5">
        <span id="qv-price" class="font-display text-2xl font-bold text-white">$0</span>
        <button id="qv-add" type="button" class="rounded-xl bg-gradient-to-r from-cyan-400 to-sky-400 px-6 py-3 text-sm font-bold text-slate-950 hover:opacity-95">
          Add to Bag
        </button>
      </div>
    </div>
  </div>

  <!-- Slide-Out Cart Drawer -->
  <div id="cart-drawer-backdrop" class="fixed inset-0 z-50 hidden bg-black/70 backdrop-blur-sm">
    <aside
      id="cart-drawer"
      aria-label="Shopping Bag"
      class="ml-auto flex h-full w-full max-w-md flex-col border-l border-slate-800 bg-[#090c14] p-6 shadow-2xl"
    >
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <h2 class="font-display text-xl font-bold text-white">Your Shopping Bag</h2>
        <button id="close-cart-btn" type="button" class="text-slate-400 hover:text-white" aria-label="Close bag">
          <i class="fa-solid fa-xmark text-lg" aria-hidden="true"></i>
        </button>
      </div>

      <div id="cart-items" class="flex-1 space-y-4 overflow-y-auto py-5"></div>

      <div class="border-t border-slate-800 pt-5">
        <div class="flex items-center justify-between text-sm">
          <span class="text-slate-400">Subtotal</span>
          <span id="cart-subtotal" class="font-display text-xl font-bold text-white">$0.00</span>
        </div>
        <button id="checkout-btn" type="button" class="mt-4 w-full rounded-xl bg-gradient-to-r from-cyan-400 to-sky-400 py-3.5 text-sm font-bold text-slate-950 hover:opacity-95">
          Complete Demo Checkout
        </button>
        <p id="checkout-msg" class="mt-3 hidden text-center font-mono text-xs text-emerald-300"></p>
      </div>
    </aside>
  </div>

  <!-- Floating Bottom-Left Back Pill -->
  <a
    href="../../index.html"
    class="fixed bottom-5 left-5 z-50 inline-flex items-center gap-2.5 rounded-full border border-cyan-400/40 bg-[#070c18]/90 px-4 py-2.5 text-xs font-semibold text-white shadow-[0_0_24px_-4px_rgba(0,229,255,0.45)] backdrop-blur-xl transition-all hover:border-cyan-300 hover:bg-cyan-400/15 sm:text-sm"
  >
    <span aria-hidden="true">&larr;</span>
    <span>Back to Rahique.dev Portfolio</span>
  </a>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const products = [
        { id: 'aura-pro', name: 'Aura One Titanium Headphones', category: 'audio', price: 480, icon: 'fa-headphones', desc: 'Planar magnetic studio drivers housed in brushed grade-5 titanium with adaptive spatial ANC.' },
        { id: 'chronos-x', name: 'Chronos Obsidian Smart Watch', category: 'wearables', price: 620, icon: 'fa-stopwatch', desc: 'Sapphire crystal AMOLED display, 14-day battery architecture, and biometric readiness telemetry.' },
        { id: 'pulse-ear', name: 'Pulse Buds Carbon Edition', category: 'audio', price: 240, icon: 'fa-ear-listen', desc: 'Lossless ultra-low latency wireless earbuds inside a forged carbon charging vault.' },
        { id: 'halo-ring', name: 'Aura Halo Biometric Ring', category: 'wearables', price: 340, icon: 'fa-ring', desc: 'Featherweight PVD-coated ceramic sleep and recovery tracker engineered for 24/7 wear.' },
        { id: 'mag-dock', name: 'Monolith MagSafe Desk Dock', category: 'accessories', price: 165, icon: 'fa-bolt', desc: 'CNC-milled anodized aluminum 3-in-1 fast charging station with weighted obsidian base.' },
        { id: 'folio-case', name: 'Stealth Aramid Travel Vault', category: 'accessories', price: 110, icon: 'fa-briefcase', desc: 'Weather-sealed ballistic aramid fiber case sized for headphones, cables, and DACs.' },
      ];

      const grid = document.getElementById('product-grid');
      const cart = new Map();
      let activeCategory = 'all';
      let quickViewProduct = null;

      const renderProducts = () => {
        const list = activeCategory === 'all' ? products : products.filter((p) => p.category === activeCategory);
        grid.innerHTML = '';
        list.forEach((p) => {
          const card = document.createElement('article');
          card.className = 'aura-card flex flex-col overflow-hidden rounded-3xl p-6 transition-transform hover:-translate-y-1 hover:border-cyan-400/40';
          card.innerHTML = `
            <div class="flex h-44 items-center justify-center rounded-2xl bg-gradient-to-br from-slate-900 via-[#0d1526] to-cyan-950/40">
              <i class="fa-solid ${p.icon} text-5xl text-cyan-300" aria-hidden="true"></i>
            </div>
            <div class="mt-5 flex items-center justify-between">
              <span class="font-mono text-[11px] uppercase tracking-widest text-cyan-300">${p.category}</span>
              <span class="font-display text-lg font-bold text-white">$${p.price}</span>
            </div>
            <h2 class="mt-2 font-display text-xl font-bold text-white">${p.name}</h2>
            <p class="mt-2 flex-1 text-sm text-slate-400">${p.desc}</p>
            <div class="mt-6 flex gap-3">
              <button type="button" data-qv="${p.id}" class="flex-1 rounded-xl border border-slate-700 bg-slate-900/80 py-2.5 text-xs font-semibold text-slate-200 hover:border-cyan-400">Quick View</button>
              <button type="button" data-add="${p.id}" class="flex-1 rounded-xl bg-cyan-400 py-2.5 text-xs font-bold text-slate-950 hover:bg-cyan-300">Add to Bag</button>
            </div>
          `;
          grid.appendChild(card);
        });
      };

      const renderCart = () => {
        const itemsEl = document.getElementById('cart-items');
        const countEl = document.getElementById('cart-count');
        const subtotalEl = document.getElementById('cart-subtotal');

        let totalQty = 0;
        let subtotal = 0;
        itemsEl.innerHTML = '';

        if (cart.size === 0) {
          itemsEl.innerHTML = '<p class="py-10 text-center text-sm text-slate-400">Your shopping bag is currently empty.</p>';
        } else {
          cart.forEach((qty, id) => {
            const p = products.find((item) => item.id === id);
            if (!p) return;
            totalQty += qty;
            subtotal += p.price * qty;
            const row = document.createElement('div');
            row.className = 'flex items-center justify-between rounded-2xl border border-slate-800 bg-slate-950/70 p-4';
            row.innerHTML = `
              <div>
                <p class="font-display text-sm font-bold text-white">${p.name}</p>
                <p class="font-mono text-xs text-cyan-300">$${p.price} &times; ${qty}</p>
              </div>
              <div class="flex items-center gap-2">
                <button type="button" data-dec="${id}" class="h-7 w-7 rounded-lg border border-slate-700 text-xs text-white">-</button>
                <button type="button" data-inc="${id}" class="h-7 w-7 rounded-lg border border-slate-700 text-xs text-white">+</button>
                <button type="button" data-rem="${id}" class="ml-1 text-xs text-rose-400" aria-label="Remove"><i class="fa-solid fa-trash"></i></button>
              </div>
            `;
            itemsEl.appendChild(row);
          });
        }

        countEl.textContent = String(totalQty);
        subtotalEl.textContent = `$${subtotal.toFixed(2)}`;
      };

      const addToCart = (id) => {
        cart.set(id, (cart.get(id) || 0) + 1);
        renderCart();
      };

      // Category buttons
      document.querySelectorAll('.cat-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.cat;
          document.querySelectorAll('.cat-btn').forEach((b) => {
            b.className = b === btn
              ? 'cat-btn rounded-full bg-white px-5 py-2 text-xs font-bold uppercase tracking-wider text-slate-950'
              : 'cat-btn rounded-full border border-slate-700 bg-slate-900/70 px-5 py-2 text-xs font-semibold uppercase tracking-wider text-slate-300 hover:border-cyan-400';
          });
          renderProducts();
        });
      });

      // Product grid actions
      grid.addEventListener('click', (e) => {
        const addBtn = e.target.closest('[data-add]');
        const qvBtn = e.target.closest('[data-qv]');
        if (addBtn) {
          addToCart(addBtn.dataset.add);
          document.getElementById('cart-drawer-backdrop').classList.remove('hidden');
        }
        if (qvBtn) {
          quickViewProduct = products.find((p) => p.id === qvBtn.dataset.qv);
          if (!quickViewProduct) return;
          document.getElementById('qv-cat').textContent = quickViewProduct.category;
          document.getElementById('qv-title').textContent = quickViewProduct.name;
          document.getElementById('qv-desc').textContent = quickViewProduct.desc;
          document.getElementById('qv-price').textContent = `$${quickViewProduct.price}`;
          const m = document.getElementById('quickview-modal');
          m.classList.remove('hidden');
          m.classList.add('flex');
        }
      });

      document.getElementById('qv-close').addEventListener('click', () => {
        const m = document.getElementById('quickview-modal');
        m.classList.add('hidden');
        m.classList.remove('flex');
      });

      document.getElementById('qv-add').addEventListener('click', () => {
        if (quickViewProduct) addToCart(quickViewProduct.id);
        const m = document.getElementById('quickview-modal');
        m.classList.add('hidden');
        m.classList.remove('flex');
        document.getElementById('cart-drawer-backdrop').classList.remove('hidden');
      });

      // Cart drawer open/close & quantity controls
      document.getElementById('open-cart-btn').addEventListener('click', () => {
        document.getElementById('cart-drawer-backdrop').classList.remove('hidden');
      });
      document.getElementById('close-cart-btn').addEventListener('click', () => {
        document.getElementById('cart-drawer-backdrop').classList.add('hidden');
      });
      document.getElementById('cart-drawer-backdrop').addEventListener('click', (e) => {
        if (e.target.id === 'cart-drawer-backdrop') e.target.classList.add('hidden');
      });

      document.getElementById('cart-items').addEventListener('click', (e) => {
        const inc = e.target.closest('[data-inc]');
        const dec = e.target.closest('[data-dec]');
        const rem = e.target.closest('[data-rem]');
        if (inc) cart.set(inc.dataset.inc, (cart.get(inc.dataset.inc) || 0) + 1);
        if (dec) {
          const cur = cart.get(dec.dataset.dec) || 0;
          if (cur <= 1) cart.delete(dec.dataset.dec);
          else cart.set(dec.dataset.dec, cur - 1);
        }
        if (rem) cart.delete(rem.dataset.rem);
        renderCart();
      });

      document.getElementById('checkout-btn').addEventListener('click', () => {
        const msg = document.getElementById('checkout-msg');
        msg.classList.remove('hidden');
        if (cart.size === 0) {
          msg.textContent = 'Add at least one item to test checkout.';
          return;
        }
        cart.clear();
        renderCart();
        msg.textContent = 'Demo order confirmed! Thank you for testing Aura Luxe.';
      });

      renderProducts();
      renderCart();
    });
  </script>
</body>
</html>
